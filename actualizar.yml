name: Actualizar alerta

on:
  schedule:
    - cron: "0 11 * * *"   # 06:00 en Ecuador
    - cron: "0 21 * * *"   # 16:00 en Ecuador
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos y generar la página
        run: python generar.py
      - name: Guardar el resumen del día en el historial
        if: github.event_name != 'push'
        run: |
          git config user.name "alerta-bot"
          git config user.email "alerta-bot@users.noreply.github.com"
          git add historial
          git commit -m "Historial $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
